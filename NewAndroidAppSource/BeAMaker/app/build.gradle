apply plugin: 'com.android.application'

android {
    namespace 'com.beamaker.app'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.beamaker.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "1.0"

        // The prebuilt libnode.so was built with the c++_shared STL.
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
            }
        }

        // Match whichever ABIs you copied into app/libnode/bin/.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            // Configured by Android Studio default debug keystore
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    // Package the prebuilt libnode.so files that you copied into app/libnode/bin/<ABI>/.
    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin/']
        }
    }

    // The nodejs-project folder under assets can be large (npm modules);
    // don't let AAPT try to compress files it doesn't need to.
    androidResources {
        noCompress += ['node']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.8.0'
        implementation 'com.google.android.material:material:1.14.0'
        implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        implementation 'androidx.core:core-splashscreen:1.2.0'
    }
}
