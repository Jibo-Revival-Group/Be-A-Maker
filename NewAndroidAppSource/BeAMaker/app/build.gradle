apply plugin: 'com.android.application'

android {
    namespace 'com.beamaker.app'
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.beamaker.app"
        minSdkVersion 24
        targetSdkVersion 35
        // Keep in step with the release tag: the in-app updater compares this with the latest GitHub release.
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 7
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : "1.1.0"

        // The prebuilt libnode.so was built with the c++_shared STL.
        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
            }
        }

        // Match whichever ABIs you copied into app/libnode/bin/.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        // CI writes the 5x1 key (the one BEep uses) from repository secrets; local builds use the debug key.
        release {
            storeFile System.getenv('RAM_KEYSTORE') ? file(System.getenv('RAM_KEYSTORE')) : null
            storePassword System.getenv('RAM_KEYSTORE_PASSWORD')
            keyAlias 'beep'
            keyPassword System.getenv('RAM_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv('RAM_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    // Package the prebuilt libnode.so files that you copied into app/libnode/bin/<ABI>/.
    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin/']
        }
    }

    // The nodejs-project folder under assets can be large (npm modules);
    // don't let AAPT try to compress files it doesn't need to.
    androidResources {
        noCompress += ['node']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.8.0'
        implementation 'com.google.android.material:material:1.14.0'
        implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        implementation 'androidx.core:core-splashscreen:1.2.0'
    }
}

// The app runs the web app's own Node server (../../../web) with nodejs-mobile, plus the stock app's assets/ and res/
// it serves, so they are copied in at build time instead of being kept twice in the repo.
def repoRoot = rootProject.file('../..')
def webAssets = layout.buildDirectory.dir('generated/webAssets')
tasks.register('npmInstallWeb', Exec) {
    workingDir new File(repoRoot, 'web')
    commandLine 'npm', 'ci', '--omit=dev', '--no-audit', '--no-fund'
    onlyIf { !new File(repoRoot, 'web/node_modules').exists() }
}
tasks.register('syncWebAssets', Sync) {
    dependsOn 'npmInstallWeb'
    into webAssets
    from(repoRoot) { include 'splash.png' }
    from(new File(repoRoot, 'assets')) { into 'assets' }
    from(new File(repoRoot, 'res')) { into 'res' }
    from(new File(repoRoot, 'web')) { into 'nodejs-project'; exclude 'data/**' }
}
android.sourceSets.main.assets.srcDir webAssets
tasks.named('preBuild') { dependsOn 'syncWebAssets' }
