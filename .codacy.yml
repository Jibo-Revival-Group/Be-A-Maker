# Exclude generated artifacts and files with invalid UTF-8 that make Codacy's
# SARIF formatter fail while reading source lines.
exclude_paths:
  - "original/**"
  - "**/build/**"
  - "**/.gradle/**"
  - "**/node_modules/**"
  - "**/smali/**"
  - "**/*.apk"
  - "**/*.aab"
  - "**/*.jar"
  - "docs/patch-notes.md"
  - "**/values-el/strings.xml"
  - "**/values-en-rXC/strings.xml"
  - "**/values-kn/strings.xml"
  - "**/values-my/strings.xml"
  - "**/values-ne/strings.xml"
